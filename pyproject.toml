[project]
name = "korus-personal-info-checker"
version = "0.1.0"
description = "KORUS 개인정보처리시스템 접속기록 점검 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "holidays==0.96",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "rich>=15.0.0",
    "xlrd>=2.0.1",
]

[project.scripts]
korus-checker = "src.main:main"

[project.optional-dependencies]
dev = ["ruff==0.15.12", "mypy", "bandit==1.9.4", "pandas-stubs==3.0.0.260204", "types-openpyxl", "types-python-dateutil", "pre-commit", "pytest", "pytest-cov", "pytest-mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]

[tool.mypy]
mypy_path = "."
packages = ["src"]
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "holidays.*",
    "xlrd",
    "rich.*",
    "dotenv"
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
targets = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
