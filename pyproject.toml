[project]
name = "korus-personal-info-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit==1.9.3",
    "holidays==0.91",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pandas-stubs==2.3.3.260113",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "rich>=13.0.0",
    "ruff==0.14.13",
    "xlrd>=2.0.1",
]

[project.scripts]
korus-checker = "src.main:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "bandit", "pandas-stubs", "types-openpyxl", "types-python-dateutil", "pre-commit", "pytest", "pytest-cov", "pytest-mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]

[tool.mypy]
mypy_path = "."
packages = ["src"]
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "holidays.*",
    "xlrd",
    "rich.*",
    "dotenv"
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
